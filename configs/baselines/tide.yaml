model:
  name: TiDE
  enc_in: 6
  c_out: 1
  d_model: 256
  d_ff: 1024
  e_layers: 2
  dropout: 0.10
  time_feat_dim: 10

data:
  root_path: ./
  data_path: data/vpp_dataset_3years.csv
  features: M
  target: OT
  seq_len: 672
  label_len: 96
  pred_len: 96
  freq: t

training:
  seed: 2024
  batch_size: 64
  train_epochs: 100
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  patience: 10
  use_amp: true

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  path: checkpoints/Baselines/
