model:
  name: PatchTST
  enc_in: 6
  dec_in: 6
  c_out: 3
  d_model: 128
  n_heads: 4
  e_layers: 3
  d_layers: 2
  d_ff: 2048
  patch_len: 16
  stride: 8
  factor: 5
  dropout: 0.20
  attn: full
  embed: custom
  activation: gelu
  time_feat_dim: 10
  use_rope: true
  rope_base: 10000
  distil: false
  output_attention: false

data:
  root_path: ./
  data_path: data/vpp_dataset_3years.csv
  features: M
  target: OT
  seq_len: 672
  label_len: 96
  pred_len: 96
  freq: t

training:
  batch_size: 32
  train_epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  patience: 5
  use_amp: false

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  path: checkpoints/Baselines/
