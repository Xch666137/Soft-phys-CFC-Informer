model:
  name: Informer
  enc_in: 6
  dec_in: 6
  c_out: 1
  d_model: 512
  n_heads: 8
  e_layers: 3
  d_layers: 2
  d_ff: 2048
  factor: 5
  dropout: 0.10
  attn: prob
  embed: custom
  activation: gelu
  time_feat_dim: 10
  use_rope: true
  rope_base: 10000
  distil: true
  output_attention: false

data:
  root_path: ./
  data_path: data_processed/multi_portfolio/portfolio_dataset_for_training.csv
  features: M
  time_col: date
  id_col: portfolio_id
  region_col: region_id
  split_col: split
  split_strategy: portfolio_manifest
  task_mode: net_injection
  target_cols: [p_vpp_mw]
  known_future_covariate_cols: [temperature, irradiance, wind_speed]
  history_state_cols: [p_battery_mw, e_battery_soc_mwh]
  aux_target_cols: [p_load_mw, p_pv_mw, p_wind_mw, p_battery_mw, e_battery_soc_mwh]
  seq_len: 672
  label_len: 96
  pred_len: 96
  freq: t

training:
  seed: 2024
  batch_size: 128
  train_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  patience: 10
  use_amp: true
  use_compile: false

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  name: informer_net_injection
