model:
  name: DLinear
  enc_in: 6
  c_out: 3
  d_model: 512
  d_ff: 2048
  dropout: 0.05

data:
  root_path: ./
  data_path: data/vpp_dataset_3years.csv
  features: M
  target: OT
  seq_len: 672
  label_len: 96
  pred_len: 96
  freq: t

training:
  batch_size: 32
  train_epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  patience: 5
  use_amp: false

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  path: checkpoints/Baselines/
