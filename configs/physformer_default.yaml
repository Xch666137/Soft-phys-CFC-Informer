model:
  name: PhysFormer
  enc_in: 6
  d_model: 512
  n_heads: 8
  e_layers: 3
  d_ff: 2048
  factor: 5
  dropout: 0.10
  attn: full
  embed: custom
  activation: gelu
  use_rope: true
  rope_base: 10000
  distil: false

data:
  root_path: ./
  data_path: data_processed/multi_portfolio/portfolio_dataset_for_training.csv
  features: M
  target: null
  time_col: date
  id_col: portfolio_id
  region_col: region_id
  split_col: split
  split_strategy: portfolio_manifest
  task_mode: net_injection
  target_cols: [p_vpp_mw]
  known_future_covariate_cols: [temperature, irradiance, wind_speed]
  history_state_cols: [p_battery_mw, e_battery_soc_mwh]
  aux_target_cols: [p_load_mw, p_pv_mw, p_wind_mw, p_battery_mw, e_battery_soc_mwh]
  seq_len: 672
  pred_len: 96
  freq: t

training:
  seed: 2024
  batch_size: 64
  train_epochs: 100
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  patience: 25
  use_amp: true
  warmup_epochs: 5
  warmup_start_factor: 0.2
  early_stop_metric: net_mse
  early_stop_start_epoch: 20

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  name: physformer_net_injection
  path: runs/

ablation:
  no_phys_stream: false
  no_battery_branch: false
  no_aux_supervision: false
  no_soc_consistency: false
  no_future_weather: false
  shared_query_only: false
