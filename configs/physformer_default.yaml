# PhysFormer Default Configuration
# Usage: python run.py --config configs/physformer_default.yaml

model:
  name: PhysFormer
  enc_in: 6
  d_model: 512
  n_heads: 8
  e_layers: 3
  d_ff: 2048
  factor: 5
  dropout: 0.10
  attn: full
  embed: custom
  activation: gelu
  use_rope: true
  rope_base: 10000
  distil: false

data:
  root_path: ./
  data_path: data/vpp_dataset_3years.csv
  features: M
  target: null
  seq_len: 672
  pred_len: 96
  freq: t

training:
  batch_size: 128
  train_epochs: 100
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  physics_prior_weight: 0.1
  grad_clip: 1.0
  patience: 10
  use_amp: true

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 8

checkpoint:
  name: PhysFormer_full_seed2024
  path: exp_results/PhysFormer/checkpoints/

runtime:
  seed: 2024
  deterministic: false
  benchmark: true

output:
  root: exp_results
  save_gate_details: false

ablation:
  no_phys_stream: false
  no_pgcc: false
  no_future_glu: false
  no_curriculum: false
  fixed_phys: false
