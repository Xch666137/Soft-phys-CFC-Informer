# B1-R1 low-LR rescue arm: pretrained init + short net-MSE finetune.
#
_base_: base/v5_base.yaml
model:
  name: PhysFormer-iGT
training:
  train_epochs: 10
  patience: 3
  early_stop_start_epoch: 2
  learning_rate: 1.0e-5
  batch_size: 256
  seed: 2025
  val_interval: 1
  grad_angle_interval: 999
  component_loss_weight: 0.0
  theory_loss_weight: 0.0
  soc_weight: 0.0
  res_reg_weight: 0.0
  phase_1_epochs: 10
  phase_2_epochs: 10
  phase_2a_epochs: 10
  phase_1_cw: 0.0
  phase_2_cw: 0.0
  phase_2a_cw: 0.0
  phase_1_rr: 0.0
  phase_2_rr: 0.0
  phase_1_tw: 0.0
  phase_2_tw: 0.0
  pretrained_path: results/physformer_igt_b1_pretrain/pretrained_checkpoint.pth
  load_pretrained_scaler_buffers: false
  l2sp_weight: 0.0
hardware:
  num_workers: 4
  persistent_workers: true
checkpoint:
  name: physformer_igt_b1_r1_low_lr_finetune_s2025
