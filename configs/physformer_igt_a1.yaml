# PhysFormer-iGT P1-1 (Ablation A1): 8-token inverted Transformer PoC
# 5 component tokens + 3 weather tokens, pure self-attention, net MSE only
#
# Gate: single-seed MAE within 2x of baseline (~2e-3 to ~4e-3 MW)
#
_base_: base/v5_base.yaml
model:
  name: PhysFormer-iGT
training:
  train_epochs: 50
  patience: 12
  early_stop_start_epoch: 12
  # Net MSE only — no component, theory, or SOC loss
  component_loss_weight: 0.0
  theory_loss_weight: 0.0
  soc_weight: 0.0
  res_reg_weight: 0.0
  # Single phase, no curriculum (all epochs in one uniform regime)
  phase_1_epochs: 50
  phase_2_epochs: 50
  phase_2a_epochs: 50
  phase_1_cw: 0.0
  phase_2_cw: 0.0
  phase_2a_cw: 0.0
  phase_1_rr: 0.0
  phase_2_rr: 0.0
  phase_1_tw: 0.0
  phase_2_tw: 0.0
  seed: 2025
  val_interval: 5
  grad_angle_interval: 999
hardware:
  num_workers: 4
  persistent_workers: true
checkpoint:
  name: physformer_igt_a1
