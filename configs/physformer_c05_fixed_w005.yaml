# C05 ablation v2: Fixed component_loss_weight=0.05 (higher, no curriculum)
#
# Tests whether a stronger fixed component supervision weight can achieve
# the benefits of curriculum (Phase 1 warmup + Phase 2 annealing) without
# the schedule complexity.
#
# Weight 0.05 was the original V4 component supervision weight — identified
# as near the Pareto-optimal knee (N04). If C05 fixed-w002 matches curriculum,
# this config tests whether the Pareto optimum is reachable with fixed weight.
# If C05 fixed-w002 underperforms curriculum, this config tests whether a
# higher fixed weight can compensate.

model:
  name: PhysFormer
  enc_in: 6
  d_model: 256
  n_heads: 8
  e_layers: 2
  d_ff: 512
  factor: 5
  dropout: 0.1
  attn: full
  embed: custom
  activation: gelu
  use_rope: true
  rope_base: 10000
  distil: false
  use_temporal_decoder: true
  film_scale: 0.5
  time_feat_dim: 10
  load_gru_hidden: 64
  load_gru_use_temp: true
  load_temp_model: "mlp"
  dec_in: 6
  c_out: 1
  output_attention: false
  decoder_n_heads: null

data:
  root_path: /root/autodl-tmp
  data_path: physformer/data_processed/multi_portfolio/portfolio_dataset_for_training.csv
  features: M
  target: null
  time_col: date
  id_col: portfolio_id
  region_col: region_id
  split_col: split
  split_strategy: portfolio_manifest
  task_mode: net_injection
  target_cols:
  - p_vpp_mw
  known_future_covariate_cols:
  - temperature
  - irradiance
  - wind_speed
  history_state_cols:
  - p_battery_mw
  - e_battery_soc_mwh
  aux_target_cols:
  - p_load_mw
  - p_pv_mw
  - p_wind_mw
  - p_battery_mw
  - e_battery_soc_mwh
  seq_len: 672
  pred_len: 96
  freq: t
  label_len: 0

training:
  batch_size: 64
  train_epochs: 50
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  grad_clip: 1.0
  patience: 20
  use_amp: true
  warmup_epochs: 5
  warmup_start_factor: 0.2
  early_stop_metric: net_mse
  early_stop_start_epoch: 20
  soc_weight: 0.1
  component_loss_weight: 0.01
  theory_loss_weight: 0.1
  restart_t0: 20
  restart_t_mult: 1
  res_reg_weight: 0.01
  # --- Fixed-weight, higher: λ=0.05, stronger physics supervision ---
  phase_1_epochs: 0
  phase_2_epochs: 50
  phase_1_cw: 0.05
  phase_2_cw: 0.05
  phase_1_rr: 0.02
  phase_2_rr: 0.02
  phase_1_tw: 0.1
  phase_2_tw: 0.1
  seed: 2024
  log_interval: 50
  battery_component_weight: 1.0
  detach_mode_phase2: "none"

hardware:
  use_gpu: true
  gpu: 0
  num_workers: 2
  pin_memory: true
  use_multi_gpu: false
  device_ids:
  - 0
  persistent_workers: true
  prefetch_factor: 4

checkpoint:
  path: /root/autodl-tmp/physformer/runs/physformer_c05_fixed_w005
  name: physformer_c05_fixed_w005

ablation:
  no_phys_stream: false
  no_battery_branch: false
  no_soc_consistency: false
  no_future_weather: false
  no_battery_physics_loss: false
  no_temporal_decoder: false
  no_deep_battery_context: false
