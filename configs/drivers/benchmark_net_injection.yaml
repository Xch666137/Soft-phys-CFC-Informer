benchmark:
  jobs:
    - name: physformer_net_injection
      run_name: physformer_net_injection
      config: configs/physformer_default.yaml
      seeds: [2024, 2025, 2026]
      batch_size: 128
      lr: 1.0e-4
      patience: 25
      warmup_epochs: 5
      warmup_start_factor: 0.2
      early_stop_metric: net_mse
      early_stop_start_epoch: 10
      num_workers: 12
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      log_interval: 50
    - name: dlinear_net_injection
      run_name: dlinear_net_injection
      config: configs/baselines/dlinear_net_injection.yaml
      seeds: [2024, 2025, 2026]
      batch_size: 512
      num_workers: 12
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      log_interval: 50
    - name: tide_net_injection
      run_name: tide_net_injection
      config: configs/baselines/tide_net_injection.yaml
      seeds: [2024, 2025, 2026]
      batch_size: 160
      num_workers: 12
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      log_interval: 50
    - name: timexer_net_injection
      run_name: timexer_net_injection
      config: configs/baselines/timexer_net_injection.yaml
      seeds: [2024, 2025, 2026]
      batch_size: 128
      num_workers: 12
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      log_interval: 50
    - name: tft_net_injection
      run_name: tft_net_injection
      config: configs/baselines/tft_net_injection.yaml
      seeds: [2024, 2025, 2026]
      batch_size: 128
      num_workers: 12
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      log_interval: 50
