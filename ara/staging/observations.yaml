          load   -0.00066 -> -0.00007  (-89%)
          pv     -0.00325 -> -0.00094  (-71%)
          batt_p -0.00190 -> -0.00025  (-87%)
          batt_soc -0.01425 -> -0.00236 (-83%)
        Per-component diag-var sum (MW^2): 4.65e-5 -> 2.20e-5 (-53%).
        Cross-cov contribution (the cancellation budget): -3.57e-5 -> -1.28e-5
          (|cancellation| -64%, i.e. detach has DRAMATICALLY LESS cancellation).
        Cancellation ratio (per-sample mean): 0.578 -> 0.478 (-17%).
        Net Var(error_net) (MW^2): 1.08e-5 -> 9.18e-6 (-15%).

      Reading: baseline relies on strong negative covariances (PV·BattP, Load·PV)
      to absorb ~77% of large biased component errors into the aggregate. detach
      eliminates much of the bias and ~half of the diag variance; the consequent
      loss of cov-driven cancellation is more than compensated by the smaller
      starting variance. e3 magnifies the baseline regime (bigger diag var,
      stronger cancellation, but cancellation cannot keep up → worst observed
      Var(error_net) of the three). This is internally consistent with O32
      (e3 wins Val MSE on normalized space but loses Test MSE on real MW).

