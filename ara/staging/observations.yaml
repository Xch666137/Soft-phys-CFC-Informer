  - id: O13
    timestamp: "2026-05-15T15:00"
    provenance: ai-suggested
    content: >
      建筑热惯性意味着室外温度对室内负荷的影响存在滞后。当前模型仅使用瞬时温度 T(t),
      忽略了建筑围护结构的蓄热/放热延迟。实际负荷对温度的响应是多个时间尺度的积分:
      即时 (当前小时)、短滞后 (1-3h, 轻型结构热质量)、中滞后 (6-12h, 重型结构)、
      昼夜记忆 (24h). ASHRAE 变基准度日法使用 3 日平均温度正是基于此原理.

      方案: 将单温度输入替换为滞后温度状态向量
      T_lag(t) = [T(t), T(t−1h), T(t−3h), T(t−6h), T(t−12h), T(t−24h)]

      可叠加在 BalancePoint 或 Temp MLP 上:
      - BalancePoint + Lags: 每个滞后独立计算度日, 再加权融合
        → "有效温度" = Σ w_i * T(t−lag_i), 物理可解释
      - Temp MLP + Lags: MLP 输入从 1 维扩到 N_lags 维, 数据驱动融合

      触发条件: V7 Balance-Point 完成后, 若 Load residual 仍与温度变化率或滞后相关.
      实现量: ~20 行代码 + 配置 flag. 优先级: V7 之后.
    potential_type: heuristic
