    content: >
      B1 failure analysis suggests pure net_mse finetune failed mainly because it
      removed the auxiliary component objective that made the pretrained checkpoint
      useful, then restarted an aggressive OneCycle schedule from an already-good
      basin. The observed pattern (train loss decreases while Val MSE worsens) is
      consistent with train-split overfitting rather than "pretraining did not learn".

      B1 lagging A1 does not by itself prove component optimization is wrong. It
      shows the specific MCP objective is not perfectly aligned with the aggregate
      Test MAE gate. A1 optimizes only signed aggregate error through
      net = load - pv - wind + batt; B1 adds masked component MAE, which pushes each
      component toward individually accurate conditional means. Because aggregate
      accuracy depends on signed error covariance (C08), component-level correctness
      can conflict with the cancellation structure that minimizes net error.

      Code audit adds two confounds that should be checked before crystallizing a
      stronger claim: (1) current PretrainLoss is masked component MAE + lambda_net
      * net MSE only, not a theory-loss physics pretrain; (2) pretraining_mode=True
      fits/uses train+val data and scaler buffers in the model state_dict, while
      finetune/test datasets are built from train-only scalers, so loading the
      checkpoint may import train+val scaler buffers into a train-scaler loss/data
      regime. Other possible alignment issues: checkpoint selection uses total
      pretrain Val Loss rather than Val Net, zero masking has no explicit mask token,
      and lambda_net=0.3 may underweight aggregate net gradients.
