  - id: O48
    timestamp: "2026-05-27T23:00"
    provenance: ai-executed
    content: >
      Batched GRU tokenization (5 components → single (B*5, T, 1) GRU call) plus
      batch_size 256 increased training throughput from 75 S/s (serial GRU × 5, bs=128)
      to 700+ S/s (9.3× speedup). GPU utilization improved from 17% to 25%. Total
      epoch time reduced from ~30 min to ~3.2 min. The key insight: cuDNN GRU benefits
      disproportionately from batched calls — the 5× reduction in kernel launch overhead
      plus larger batch size into GRU yields super-linear speedup. This is a general
      heuristic for multi-variate tokenization in inverted Transformer architectures.
    context: >
      Original implementation used 5 separate ComponentTokenEmbedder instances with
      for-loop serial GRU calls. Refactored to BatchedComponentEmbedding which permutes
      (B, T, C)→(B*C, T) before a single GRU call. Similarly refactored weather
      embedding. torch.compile compatible (no ModuleList iteration): comp_embedding,
      weather_embedding, component_projectors all compiled successfully after fix.
    potential_type: heuristic
    bound_to: [N101]
    promoted: true
    promoted_to: "logic/solution/heuristics.md:H11"
    crystallized_via: verbal-affirmation
