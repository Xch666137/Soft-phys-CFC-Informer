  - id: O53
    timestamp: "2026-05-31T15:40"
    provenance: ai-executed
    content: >
      B1 finetune dead end: pure net_mse finetuning on pretrained weights systematically
      degrades performance. Two independent runs converge on the same conclusion:

      (1) Original B1 finetune (2026-05-30, 16846 server): config_to_args bug caused
      pretrained_path to never be loaded — training was effectively from-scratch net_mse.
      3 seeds: best Test MAE = 0.001839-0.001863 (all above Gate 0.001811). Pretrained
      direct test MAE = 0.001820 (0.5% closer to Gate, beats all finetune results).

      (2) Fixed B1 finetune (2026-05-31, VGPU-32GB): pretrained weights correctly loaded
      (confirmed in log). Epoch 1 Train Loss 0.1163 (9× better than buggy 1.0306).
      BUT all 3 seeds show monotonic Val MSE degradation:
        E1: 7.956-7.999e-06 → E2: +4% → E3: +7.5%
      Train Loss decreasing (0.116→0.109) while Val worsening — overfitting.
      Training killed at user request after Epoch 3.

      Root cause interpretation: the multi-task pretraining objective (component_mae +
      theory_mae + λ=0.3 net_mse) acts as an effective regularizer. Removing auxiliary
      losses during finetuning removes this regularization, causing the model to overfit
      to net_mse. The pretrained checkpoint is ALREADY the optimal net predictor —
      finetuning only makes it worse.

      This parallels Phase A's C12 finding: all post-A1 complexity additions degrade
      performance. Here, even a training-paradigm change (pretrain→finetune) cannot
      improve upon the multi-task optimum. Multi-task physics loss is not a stepping
      stone — it IS the destination for this dataset.

      Bug details (N110): physformer/config.py config_to_args uses explicit manual
      key-by-key mapping for 40+ training keys but missed pretrained_path and
      pretrain_lambda_net. This is the second config_to_args propagation bug
      (cf. N65, 2026-05-22: missing curriculum keys phase_2a_epochs etc.).
      Two-part config mapping (explicit + auto TRAINING_KEYS) is a fragility pattern.
    context: >
      User asked to fix bug and re-run B1 finetune with pretrained weights on VGPU-32GB.
      Fix: 2 lines added to physformer/config.py:208-209. Training launched 3-seed on
