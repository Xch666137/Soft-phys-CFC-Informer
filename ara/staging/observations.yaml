  - id: O44
    timestamp: "2026-05-26T14:20"
    provenance: ai-executed
    content: >
      Shell discipline and remote daemon anti-pattern lessons from P2 execution:
      (1) Windows local operations should use PowerShell, not Bash — each Bash invocation
      creates a bash.exe process that may linger after completion. During P2, 8+ stale
      bash processes accumulated from completed autodl-push commands.
      (2) Remote persistent daemons MUST NOT be launched via SSH `cmd &` — the daemon
      receives SIGHUP when the SSH session ends and dies silently. The correct pattern
      is: one-shot checker script on remote + local Monitor polling loop (while+sleep).
      (3) Monitor while/until loop conditions must be tested first — the first Monitor
