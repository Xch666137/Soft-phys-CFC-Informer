  - id: O51
    timestamp: "2026-05-29T00:30"
    provenance: ai-suggested
    content: >
      Phase B hypothesis: Self-Supervised Masked Component Pretraining (MCP) can break the
      cross-portfolio generalization ceiling that Phase A established. Core logic:
      (1) A2-A5 failed because FIXED priors (physics tokens, graph bias, weather conditioning)
      impose uniform coupling forms across heterogeneous portfolios. (2) MCP replaces fixed
      priors with DATA-DRIVEN coupling discovery: randomly masking component histories forces
      the model to infer cross-component relationships from context, learning portfolio-agnostic
      coupling laws. (3) This is the BERT→finetune paradigm applied to VPP forecasting:
      pretraining on a self-supervised task → supervised finetuning on the target task.
      Unlike A2-A5, MCP adds no architecture and imposes no fixed coupling form — it only changes
      the training signal. Masking strategy: zero out 1-2 of 4 component history channels,
      predict masked components via component MAE + λ_net=0.3 net MSE anchor. Finetuning is
      standard A1 net MSE. Gate: B1 Test MAE < A1 mean 0.001811 on ≥2/3 seeds.
    context: >
      After Phase A completion (A1-A5 monotonic degradation chain, A1=global optimum at
      MAE 0.001811), user identified that self-supervised pretraining matches the DVPP
      cross-portfolio challenge: different portfolios have genuinely different coupling
      relationships, and the model needs to learn these from data rather than from fixed
      equations. Full design documented in docs/plans/2026-05-29-pretraining-finetune-phase-b.md.
      This is a new exploration path (Phase B) that branches from the Phase A conclusion.
    potential_type: claim
    bound_to: [N106, N107, N100, N105, C10]
