      detach, the theory head receives a clean physics-only gradient through
      Phase 2b refinement and converges to a near-unbiased per-component fit,
      because the residual head can no longer corrupt theory parameters through
      the joint encoder. Without detach, the residual head systematically nudges
      theory toward a biased solution that maximises aggregate cancellation —
      because aggregate net_mse is what training optimises.

      Predictions this mechanism would make if true:
        1. detach's aggregate accuracy should be MORE robust to distribution
           shift than baseline's (baseline relies on cov structure that may
           change OOD; detach has unbiased components).
        2. residual head's role under detach should be smaller; residual_std
           should be lower (consistent: 0.00216 vs baseline 0.00260, -17%).
        3. Multi-seed: bias clearance should be a STABLE property of detach,
           not a single-seed artefact. (Replication = T1.)
