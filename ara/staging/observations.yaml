      configuration: same GPU SKU may be wired as Gen4 x16 (full bandwidth) or
      Gen4 x8 (halved bandwidth, both observed instances), AND host IO contention
      varies by instance. nvidia-smi 99% utilisation is MISLEADING under PCIe
