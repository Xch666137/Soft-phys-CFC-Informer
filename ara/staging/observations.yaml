    provenance: ai-executed
    content: >
      A5 (Component-wise Horizon Decoder) extends the A1-A4 monotonic degradation chain:
      all 5 ablations show Test MAE strictly worsening as architectural complexity increases.
        A1 (8 tokens, simple FFN decoder):                 MAE 0.001811  ← OPTIMAL
        A2 (+1 physics token):                             MAE 0.001819  +0.4%
        A3 (+5 twin + 3 constraint tokens, 16 total):      MAE 0.001843  +1.8%
        A4 (+graph bias annealing B_phys + B_learned):     MAE 0.001863  +2.9%
        A5 (+per-step CrossAttention decoder + weather):   MAE 0.001947  +7.5%
      A5 is the worst despite best-ever Val MSE (E10: ~0.43 vs A4: 1.24). The horizon
      decoder's per-step CrossAttention (384 queries × 16 tokens) provides MORE capacity
      to memorize training/val patterns, amplifying the Val→Test divergence. Step-level
      weather conditioning makes the model sensitive to portfolio-specific weather patterns.
      A1's shared FFN (Linear 256→96) acts as an implicit regularizer — compressing 96-step
      prediction into a single token representation prevents overfitting. Combined with A1-A4:
      the iTransformer's value lies in component-token separation (eliminating C10 cancellation
      channel), NOT in richer decoders, physics priors, or graph constraints. All complexity
      additions are systematic overfitting amplifiers on this dataset.
    context: >
      HorizonDecoder implemented in igt_model.py (~95 lines): CompEmb + HorizonPos +
      CalendarProj → batched CrossAttention(384q × 16kv) → MLP(attended | twin_token |
      weather). 3 seeds trained on AutoDL vGPU-32GB, all early stopped E23 (best E6-E8).
