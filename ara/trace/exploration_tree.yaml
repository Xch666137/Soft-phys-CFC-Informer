# N96: PhysFormer-iGT architecture redesign (decision, open)
#   choice: Physics-Twin Graph iTransformer (iGT) as next-generation architecture
#   alternatives:
#     - "Incremental improvement on current PhysFormer (e3 sweep, M4 PCA, etc.)
#        — rejected: C10 proved shared encoder is the root cause; incremental fixes
#        are gradient hacks (detach) not architectural solutions"
#     - "Dual-encoder (physics + data separate encoders) — viable but less innovative;
#        doesn't give physics 'first-class token' status"
#     - "Physics-First (Transformer outputs physics params) — highest paper value
#        but highest risk; deferred as long-term direction"
#   rationale:
#     C10 proved that the shared encoder creates a cancellation channel
#     (encoder-depth → cross-component error correlation → signed cancellation
#     under net = load − pv − wind + batt). detach blocks this via gradient
#     hacking, not architecture. iTransformer inverts attention from time
#     dimension to variate dimension, giving each component its own token
#     and representation space — no shared d_model for FFN to mix.
#
#     The iGT upgrade adds four innovations beyond vanilla iTransformer:
#     (1) Component-Physics Twin tokens — physics as peer tokens, not FiLM
#     (2) Graph-biased attention — DVPP physical topology as attention prior
#     (3) Identifiable component residual — component loss on predictions
#         (theory + residual), not theory alone, solving residual identifiability
#     (4) State-space battery decoder — action residual + SOC recurrence
#
#     Implementation: phased (P0 correctness fixes → P1 minimal iTransformer
#     PoC → P2 Physics integration → P3 Battery + component supervision).
#     P0 is blocking regardless of architecture direction.
#   key_risks:
#     - N07 trade-off (component loss → aggregate degradation) may persist
#       even with architectural separation; tested via A4 vs A6 ablation
#     - iTransformer PoC may not reach baseline MAE; gate at P1
#     - Full iGT is ~68 tokens × O(V²) attention; compute is still small
#       (68² = 4.6k vs current 672² = 451k)
#   provenance: user (architecture vision), ai-suggested (original iTransformer
#     direction, phased plan, ablation chain), ai-executed (design doc)
#   timestamp: "2026-05-26T16:00"
#   status: resolved (2026-05-29) — partially validated, mostly deprecated.
#     P1-1/A1 (component token separation + real-unit power balance) CONFIRMED: MAE −12.5% vs c23.
#     A2-A5 ALL FAILED: A2 +0.4%, A3 +1.8%, A4 +2.9%, A5 +7.5% — monotonic degradation.
#     A6-A8 abandoned (DOA, built on failed foundations). 75% of design doc content degraded.
#     Valid content preserved: §1 C10 diagnosis, §3 P0 fixes, P1-1/A1 8-token specification.
#     Design doc marked DEPRECATED 2026-05-29. Superseded by N106 Phase B (pretraining).
#   superseded_by: N106
