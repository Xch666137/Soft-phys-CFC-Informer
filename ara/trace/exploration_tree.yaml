# N74: T0 variance decomposition on c23 vgpu_s2025 — bias-clearance regime escape (analysis, resolved)
#   Script: scripts/c08_vgpu_3way.py (newly written)
#   Output: scripts/c08_vgpu_3way_results.json
#   Method: extract y_aux from test loader (34273×96×5 samples real MW), pair with
#     component_theory_real from each run's extras/physics_states.npz, compute
#     per-component error stats and aggregate variance decomposition
#     Var(error_net) = Σ s_i^2 Var_i + 2 Σ_{i<j} s_i s_j Cov_ij, with s = [+1,-1,-1,+1,0]
#     for (load, pv, wind, batt_p, batt_soc) per the net = load - pv - wind + batt equation.
#   Key numbers (baseline → detach):
#     diag var sum: 4.65e-5 → 2.20e-5 (-53%)
#     cross cov contribution: -3.57e-5 → -1.28e-5 (|cancellation| -64%)
#     observed Var(error_net): 1.08e-5 → 9.18e-6 (-15%)
#     cancellation ratio (mean): 0.578 → 0.478 (-17%)
#     per-component bias: load -89%, pv -71%, batt_p -87%, batt_soc -83%
#   Diagnosis: detach exits the C08 cancellation regime. Aggregate gain is achieved
#   through bias clearance plus variance reduction (despite WEAKER cov-driven
#   cancellation). e3 is the opposite extreme: largest diag var and strongest
#   cancellation, yet largest observed Var(error_net) — cancellation cannot keep up.
#   Implication: under TRUE 3-stage with selective detach, the theory head receives
#   a clean physics-only gradient through Phase 2b refinement and converges to a
#   near-unbiased per-component fit. Without detach, the residual head systematically
#   nudges theory toward a biased solution that maximises aggregate cancellation
#   (because aggregate net_mse is what training optimises).
#   provenance: ai-executed
#   timestamp: "2026-05-23T13:30"
#   status: resolved
#   also_depends_on: [N70, N72, N73, C08]
