# Exploration Tree — PhysFormer (V3 → V5 tuning)
#
# This tree is a *reconstruction* from git history, research_directions.md,
# and the current codebase state. Nodes derived directly from committed
# experiments and result tables are marked `support_level: explicit`.
# Nodes that bridge the narrative are marked `support_level: inferred`.
#
# Provenance conventions:
#   user — decision/insight from researcher (刘行宇)
#   ai-suggested — proposed by Claude/Codex agent
#   ai-executed — implemented by agent
#   user-revised — user confirmed or modified AI suggestion

tree:
  # ============================================================
  # ROOT: Central Research Question
  # ============================================================
  - id: N01
    type: question
    support_level: explicit
    source_refs: ["docs/research_directions.md", "paper/en/sections/sec1_intro.tex"]
    title: "Can physics-guided inductive biases make a Transformer produce physically consistent VPP net power forecasts without sacrificing accuracy?"
    description: >
      Pure deep-learning models for VPP aggregated net power forecasting produce
      physically implausible predictions (violations of power balance, SOC constraints,
      wrong component-level attributions). Can embedding physics equations as FiLM
      conditioning — with learnable residual corrections — improve physical consistency
      while matching or exceeding black-box Transformer accuracy?
    children:

      # ============================================================
      # PHASE 0: Baseline
      # ============================================================
      - id: N02
        type: experiment
        support_level: explicit
        source_refs: ["git: 32d71de", "runs/V3"]
        title: "V3 Baseline — PhysFormer with CosineAnnealing, no component supervision"
        description: >
          First working PhysFormer: FiLM-conditioned theory branches (PV, Wind, Battery, Load),
          scalar residual correction, standard MSE loss on net injection, CosineAnnealing LR.
        result: >
          Test MAE = 1.932 kW, Theory MAE = 4.874 kW, Val MSE = 0.387.
          Theory branch produces physically plausible shapes but with large magnitude errors.
          Component-level errors not tracked individually.
        provenance: user

      # ============================================================
      # PHASE 1: Load-Aware Enhancements (V4)
      # ============================================================
      - id: N03
        type: insight
        support_level: explicit
        source_refs: ["git: 5ce164e", "git: df4661c"]
        title: "Load is the dominant error source and needs behavioral (not physics) modeling"
        description: >
          Load in a VPP is driven by human behavior (calendar, electricity pricing, habits),
          not by physical equations. Physics-only guidance for load is fundamentally incomplete.
          Need calendar features + a load-specific proxy in the loss.
        children:

          - id: N04
            type: decision
            support_level: explicit
            source_refs: ["git: df4661c", "physformer/utils/losses.py"]
            title: "Add component supervision loss in MW space with weight 0.05"
            description: >
              Add per-component MAE loss (PV, Wind, Battery Power, Battery SOC, Load)
              in physical MW units, weighted at 0.05 relative to aggregate net MSE.
              This gives the theory branches direct gradient signal.
            choice: "MAE in MW space (not normalized MAE or MSE)"
            alternatives:
              - "Normalized MAE (unitless) — rejected because physical magnitude matters"
              - "MSE on components — rejected because MAE is more interpretable in kW"
              - "Higher weight (0.1+) — tested later, found to degrade aggregate (see N11)"
            rationale: "Modest weight gives theory branches enough signal to learn physics without dominating the aggregate objective."
            provenance: user

          - id: N05
            type: experiment
            support_level: explicit
            source_refs: ["git: df4661c", "docs/research_directions.md §V4"]
            title: "V4 — calendar features + component loss + load proxy"
            description: >
              Add calendar embeddings (hour, weekday, month), component supervision
              (weight=0.05), and load-specific feature proxy to V3 architecture.
            result: >
              **Best comprehensive result**: Test MAE = 1.976 kW (-2.3% vs V3),
              Theory MAE = 3.811 kW (-21.8% vs V3), Val MSE = 0.381.
              Massive theory improvement with minimal aggregate cost.
              Revealed Load as bottleneck: Load MAE = 14.707 kW vs Wind = 0.825 kW (18x).
            evidence_refs: ["research_directions.md V4 row"]

      # ============================================================
      # DEAD END 1: Sigmoid Gate (V4.1)
      # ============================================================
      - id: N06
        type: dead_end
        support_level: explicit
        source_refs: ["git: df4661c", "docs/research_directions.md §V4.1"]
        title: "Sigmoid gate on residual connection causes theory degradation"
        hypothesis: >
          Adding a learnable sigmoid gate to the residual stream would let the model
          adaptively control how much theory influences the final prediction, preventing
          bad theory from corrupting the forecast.
        failure_mode: >
          Gate weakened the residual pathway → theory_net received degraded gradient
          from shared encoder → theory MAE regressed from 3.811 kW (V4) to 4.966 kW (V4.1).
          Gate creates a gradient bottleneck: the shared encoder couples all theory branches,
          so dampening one pathway affects all.
        lesson: >
          **Identity shortcuts are superior to gated shortcuts for physics-guided residual
          learning.** The gradient must flow unimpeded from component loss to theory branches.
          This mirrors ResNet's finding that identity shortcuts (option A) suffice and gated
          shortcuts (highway networks) don't help for deep residual learning.
        provenance: user
        also_depends_on: [N05]

      # ============================================================
      # DEAD END 2: Component Loss Too Strong (V4.2)
      # ============================================================
      - id: N07
        type: dead_end
        support_level: explicit
        source_refs: ["git: df4661c", "docs/research_directions.md §V4.2"]
        title: "Normalized component loss without gate causes theory-vs-aggregate trade-off collapse"
        hypothesis: >
          Removing the harmful sigmoid gate and keeping only normalized component loss
          + schedule fix would give the best of both worlds: good theory without gate interference.
        failure_mode: >
          Theory MAE improved to 2.981 kW (best ever) but Test MAE degraded to 2.048 kW
          (-3.6% vs V4). Component loss weight became dominant — model capacity shifted
          from aggregate accuracy to component consistency. The trade-off is real: there is
          a Pareto frontier between theory quality and aggregate accuracy.
        lesson: >
          **Component loss has a non-monotonic effect.** Weight 0.05 (V4) sits near the
          Pareto-optimal knee. Stronger component loss (V4.2's normalized variant) pushes
          past the knee into aggregate degradation. The optimal weight depends on the
          relative scales of component vs. aggregate objectives.
        provenance: user

      # ============================================================
      # PHASE 1.1: Component-Consistent Residual (V5)
      # ============================================================
      - id: N08
        type: insight
        support_level: explicit
        source_refs: ["git: 280c93f", "docs/research_directions.md §V5"]
        title: "Scalar residual causes cross-component error contamination"
        description: >
          V3/V4 use a single scalar residual added to the aggregate net injection.
          This means an error in Load prediction can be "compensated" by the residual
          in a way that corrupts PV/Wind predictions. Since the power balance is:
          net = load - pv - wind + batt, a scalar residual can't disentangle which
          component is being corrected.
        children:

          - id: N09
            type: decision
            support_level: explicit
            source_refs: ["git: 280c93f", "physformer/models/physformer.py"]
            title: "Expand residual from scalar to 5-dimensional per-component correction"
            description: >
              Replace single scalar residual with 5 per-component residuals:
              pred_net = (load_theory + load_res) - (pv_theory + pv_res)
                       - (wind_theory + wind_res) + (batt_theory + batt_res)
              Each component residual learns independently, preventing cross-component
              gradient contamination.
            choice: "5 independent residual heads per component"
            alternatives:
              - "Scalar residual (V3/V4) — rejected because it can't disentangle components"
              - "2 residuals (generation + load) — rejected as insufficient granularity"
              - "4 residuals (PV, Wind, Batt, Load) plus SOC — chosen for V5"
            rationale: >
              Per-component residuals prevent Load error from corrupting PV/Wind predictions.
              The ResNet analogy: multiple independent skip connections per feature group.
            provenance: user

          - id: N10
            type: decision
            support_level: explicit
            source_refs: ["git: 280c93f", "physformer/models/temporal_decoder.py"]
            title: "Add TemporalDecoder with time_proj(y_mark) time conditioning"
            description: >
              Add time-mark projection to the temporal decoder so residual predictions
              are conditioned on temporal features (hour, weekday, month), trained from scratch.
            choice: "Linear projection of y_mark into decoder hidden state"
            alternatives:
              - "No time conditioning (V4) — rejected because residual needs temporal context"
              - "Learned positional embedding — rejected as less informative than calendar features"
            rationale: "Residual corrections should be time-aware (e.g., load residual differs by hour and weekday)."
            provenance: user

          - id: N11
            type: experiment
            support_level: explicit
            source_refs: ["git: 280c93f", "docs/research_directions.md §V5"]
            title: "V5 — Component-consistent residual + TemporalDecoder + Curriculum training"
            description: >
              Full V5: 5 per-component residuals, time-conditioned decoder, 3-phase curriculum:
              Phase 1 (epoch 1-15): component_loss_weight=0.1, residual restricted
              Phase 2 (epoch 16-40): weight linearly decays, residual fully free
              Phase 3 (epoch 41-70): pure net_mse fine-tune
            result: >
              **Component metrics at their best** — PV MAE = 1.892 kW (-22.7% vs V4),
              Wind MAE = 0.313 kW (-11.8%), Battery Power MAE = 1.340 kW (-12.5%).
              But **aggregate degraded**: Test MAE = 2.120 kW (+7.5% vs V4),
              Val MSE = 0.404 (+11.9%). Residual statistics: mean = -0.000848 MW (closest to zero).
              SOC constraint perfectly satisfied.
            children:

              - id: N12
                type: dead_end
                support_level: explicit
                source_refs: ["docs/research_directions.md §V5", "docs/research_directions.md §Curriculum Phase 3 无效"]
                title: "Curriculum Phase 3 (pure net_mse fine-tuning) provides no validation benefit"
                hypothesis: >
                  After Phase 2 converges on the physics-accuracy trade-off, Phase 3 would
                  fine-tune only on net_mse to recover any aggregate accuracy lost to component loss.
                failure_mode: >
                  Model was already converged at the end of Phase 2. Phase 3 produced no
                  validation improvement — the model had already found the Pareto-optimal
                  point under the given architecture and loss configuration.
                lesson: >
                  **Curriculum Phase 3 is unnecessary.** The model saturates on net_mse
                  during Phase 2. Removing Phase 3 saves 30 epochs of compute with no
                  accuracy cost. Two-phase (component_warmup → joint_annealing) is sufficient.
                provenance: user

              - id: N13
                type: insight
                support_level: explicit
                source_refs: ["docs/research_directions.md §V5 问题"]
                title: "Component loss weight 0.1 in V5 Phase 1 is too high"
                description: >
                  V5's Phase 1 uses component_loss_weight=0.1 (2x V4's 0.05), causing
                  model capacity to shift excessively toward component consistency at the
                  expense of aggregate accuracy. The aggregate degradation (+7.5% MAE)
                  is the cost of over-emphasizing per-component metrics.
                evidence_refs: ["V5 aggregate vs V4 comparison"]

      # ============================================================
      # CURRENT: V5.5 2×2 消融实验 (executed 2026-05-12)
      # ============================================================
      - id: N14
        type: decision
        support_level: explicit
        source_refs: ["docs/research_directions.md §V5 调优方案", "results/v5_ablation/"]
        title: "V5.5 2×2 ablation: restart_t0(8 vs 20) × battery_component_weight(1.0 vs 5.0)"
        description: >
          4-experiment parallel ablation on AutoDL vGPU-32G (RTX 4080 SUPER, 12 CPU cores):
          V5.4 (R8,B1) — baseline, V5.5 (R20,B5) — both fixes, V5.5a (R8,B5) — batt_w only,
          V5.5b (R20,B1) — restart only. All share: phase_1_epochs=8, phase_2_epochs=50,
          patience=20, early_stop_start_epoch=20, num_workers=2, seed=2024.
          All 4 early stopped at epoch ~39. Test executed on all.
        choice: "2×2 factorial design with early stopping"
        provenance: user
        status: resolved
        children:

          - id: N22
            type: experiment
            support_level: explicit
            source_refs: ["results/v5_ablation/physformer_v5_4/metrics.json", "results/v5_ablation/physformer_v5_4/train.log"]
            title: "V5.4 (R8,B1) — baseline: moderate training, moderate test"
            description: >
              restart_t0=8 (frequent cosine restart, Phase 1→2 sync), battery_component_weight=1.0.
              Best Val MSE=0.3879 (epoch 9), Final Val MSE=0.4300. Test: MAE=0.00207 MW,
              MSE=7.999e-6, RMSE=0.00283 MW, RampViol=0.0035%.
              Load MAE=0.0148 kW, Battery MAE=0.0213 kW — 7-13x worse than other configs.
              GradCos=0.000 constant, GradNorm~1e-9 — gradient VANISHING, not convergence.
            result: >
              Gradient collapse: R8+B1 combination causes physics layer gradient to vanish entirely.
              Load and Battery branches effectively failed — predicting near-constant output.
              Despite this, aggregate metrics remain competitive, suggesting residual head
              compensated for failed physics branches.
            provenance: ai-executed

          - id: N23
            type: experiment
            support_level: explicit
            source_refs: ["results/v5_ablation/physformer_v5_5/metrics.json", "results/v5_ablation/physformer_v5_5/train.log"]
            title: "V5.5 (R20,B5) — both fixes: worst overall"
            description: >
              restart_t0=20 + battery_component_weight=5.0. Best Val MSE=0.4258 (epoch 33),
              Final Val MSE=0.4265. Test: MAE=0.00226 MW (worst), MSE=8.955e-6 (worst),
              RMSE=0.00299 MW (worst), RampViol=0.0060% (worst, 2.4x of best).
              GradCos highly volatile (−0.970 to +0.921).
            result: >
              R20+B5 combination produces the worst results across nearly all test metrics.
              The two "safety" mechanisms (longer restart + stronger battery supervision)
              INTERACT NEGATIVELY: model over-trusts physics layer, residual head under-compensates,
              leading to higher ramp violations. Counter-intuitive: adding safety mechanisms
              independently can reduce safety when combined.
            provenance: ai-executed

          - id: N24
            type: experiment
            support_level: explicit
            source_refs: ["results/v5_ablation/physformer_v5_5a/metrics.json", "results/v5_ablation/physformer_v5_5a/train.log"]
            title: "V5.5a (R8,B5) — training champion, test runner-up"
            description: >
              restart_t0=8 + battery_component_weight=5.0. Best Val MSE=0.3830 (epoch 12,
              BEST OVERALL), Final Val MSE=0.4107. Test: MAE=0.00198 MW (best),
              MSE=7.628e-6, RMSE=0.00276 MW, RampViol=0.0047%.
              Component metrics: Battery Power MAE=0.00161 MW (best), Battery SOC MAE=0.00814 (best).
            result: >
              Dominated training: 12 consecutive rounds as leader. Battery_component_weight=5.0
              prevents gradient vanishing that afflicts V5.4 (same R8). But test performance
              slightly behind V5.5b — possible overfitting from frequent restarts + strong
              component supervision narrowing the solution space too aggressively.
            provenance: ai-executed

          - id: N25
            type: experiment
            support_level: explicit
            source_refs: ["results/v5_ablation/physformer_v5_5b/metrics.json", "results/v5_ablation/physformer_v5_5b/train.log"]
            title: "V5.5b (R20,B1) — test champion, training laggard"
            description: >
              restart_t0=20 + battery_component_weight=1.0 (default). Best Val MSE=0.3982 (epoch 8),
              Final Val MSE=0.4319. Test: MAE=0.00200 MW, MSE=7.281e-6 (BEST), RMSE=0.00270 MW (BEST),
              RampViol=0.0025% (BEST). Residual mean=−0.00052 MW — closest to zero (ideal unbiased).
              Theory MAE=0.00275 MW (best).
            result: >
              TRAIN/TEST DIVERGENCE: worst in training (4th), best in testing (1st, 6/7 metrics).
              Longer restart period (R20) provides implicit regularization → better generalization.
              Battery_component_weight=1.0 (default) avoids over-constraining physics branches
              during Phase 2 → residual head learns more balanced corrections.
              This is the RECOMMENDED THESIS CONFIGURATION based on test-set evidence.
            provenance: ai-executed

      # ============================================================
      # DESIGN HEURISTICS (cross-cutting)
      # ============================================================
      - id: N15
        type: decision
        support_level: inferred
        source_refs: ["physformer/models/physformer.py", "physformer/layers/conditioning.py"]
        title: "FiLM conditioning chosen over additive or concatenative conditioning"
        description: >
          Physics features (irradiance, temperature, wind speed, calendar) condition
          the Transformer encoder via FiLM (feature-wise linear modulation): γ, β = f(physics_features),
          then h_out = γ ⊙ h + β. This is more expressive than simple concatenation.
        choice: "FiLM (affine transformation per channel)"
        alternatives:
          - "Concatenate physics features to input — rejected as less expressive"
          - "Cross-attention to physics features — rejected as too heavy for this scale"
          - "Additive bias only (β without γ) — rejected as insufficient modulation"
        rationale: "FiLM provides multiplicative and additive conditioning, allowing physics to scale as well as shift hidden representations."
        provenance: user

      - id: N16
        type: decision
        support_level: explicit
        source_refs: ["docs/research_directions.md §V5", "physformer/utils/losses.py"]
        title: "MAE chosen over MSE for component supervision loss"
        description: >
          Component supervision uses MAE (L1) rather than MSE (L2) to avoid
          over-penalizing large Load errors (14.7 kW) relative to small Wind errors (0.8 kW).
        choice: "MAE (L1) for component loss"
        alternatives:
          - "MSE (L2) — rejected because it over-emphasizes Load (18x weight dominance)"
          - "Huber — medium-term option, provides smooth transition between L1/L2"
          - "Per-component normalized loss — rejected as losing physical magnitude information"
        rationale: "MAE treats all kW errors linearly, preventing Load from dominating component gradient. MSE would give Load 324x the weight of Wind (18²)."
        provenance: user

      - id: N17
        type: decision
        support_level: explicit
        source_refs: ["physformer/models/"]
        title: "Separate theory encoder and correction encoder with shared backbone"
        description: >
          The Transformer encoder is shared, but theory branches and residual heads are
          separate per component. This enables: (1) shared representation learning for all
          components, (2) independent per-component theory computation from physics equations,
          (3) independent per-component residual correction.
        choice: "Shared encoder + per-component heads"
        alternatives:
          - "Fully separate encoders per component — rejected as parameter-inefficient"
          - "Single head for all components — rejected (see N09, scalar residual dead end)"
        rationale: "Shared encoder captures cross-component interactions (e.g., PV output affects net load which affects battery dispatch), while separate heads maintain component-specific gradient paths."
        provenance: user

      # ============================================================
      # BRANCH: Future Directions (pending decisions)
      # ============================================================
      - id: N18
        type: decision
        support_level: explicit
        source_refs: ["docs/research_directions.md §方向 B", "results/v5_ablation/", "results/dual-draft/v5_ablation_analysis.md"]
        title: "V6: Replace Load physics branch with behavioral/temporal module"
        description: >
          V5.5 消融结论: HDD/CDD-based Load physical model is architecturally wrong for VPP load.
          Load is driven by human behavior (calendar, occupancy, pricing), NOT thermodynamics.
          Evidence: Load MAE 5-18× worse than Wind across V3→V5; R8+B1 causes Load/Battery
          gradient vanishing (physics guidance provides zero useful signal for Load).

          V6 Direction: separate Load from the physics-guided branches.
          - PV, Wind, Battery: keep FiLM-conditioned physics branches (physics IS meaningful)
          - Load: replace HDD/CDD with behavioral/temporal module (small TCN, GRU, or attention
            over calendar + historical load + weather sensitivity patterns)
          - Net reconstruction unchanged: net = load_pred - pv - wind + batt
          - Keep component-consistent residual for all 5 components
        choice: "Dual-stream: physics for DER + behavioral for Load"
        alternatives:
          - "Keep HDD/CDD but add more features — rejected: the model class is wrong, not the features"
          - "Remove Load from component supervision — rejected: component decomposition is a core contribution"
          - "Use pure Transformer for Load — viable but less interesting than dedicated behavioral module"
        rationale: >
          'Physics-guided' doesn't mean all components must use physics — it means the right
          inductive bias for each component. PV/Wind/Battery benefit from physical equations
          (irradiance → PV, wind speed → power, signed-power → SOC). Load benefits from
          behavioral patterns (calendar, weather sensitivity, temporal autocorrelation).
          This is not abandoning physics guidance; it's allocating it correctly.
        provenance: user
        timestamp: "2026-05-12T20:45"
        status: resolved
        trigger: "V5.5 消融结果 + 用户明确确认 V6 方向"

      - id: N19
        type: question
        support_level: explicit
        source_refs: ["docs/research_directions.md §方向 F"]
        title: "Should uncertainty quantification be added for risk-aware VPP dispatch?"
        description: >
          VPP dispatch needs prediction intervals for risk-based decision making.
          MC Dropout or Gaussian NLL head could add uncertainty quantification
          as a secondary contribution.
        status: open
        trigger: "After V5.5 stabilizes, evaluate remaining experiment time and paper narrative fit"
        provenance: user

      - id: N20
        type: question
        support_level: explicit
        source_refs: ["docs/research_directions.md §方向 E"]
        title: "Can improved PV/Wind physical models reduce residual magnitude?"
        description: >
          Current PV model: 1st-order irradiance × temperature. Wind model: generic cubic curve.
          Could solar zenith angle, clear-sky index, inverter clipping, hub-height wind correction,
          and air density correction improve theory accuracy and reduce residual burden?
        status: open
        trigger: "Check V5 per-component residuals — if PV/Wind residuals significantly > 0 after V5.5 tuning"
        provenance: user

