# ============================================================
# N127: torch.compile _orig_mod. key prefix bug (dead_end, 2026-06-06)
# ============================================================

- id: N127
  type: dead_end
  title: "torch.compile _orig_mod. prefix breaks checkpoint loading into uncompiled model"
  provenance: ai-executed
  timestamp: "2026-06-06T12:00"
  hypothesis: >
    torch.compile wraps modules in OptimizedModule, adding _orig_mod. prefix to
    state_dict keys. Checkpoints saved from compiled models have keys like
    comp_embedding._orig_mod.gru.weight_ih_l0. Loading into uncompiled model
    expects comp_embedding.gru.weight_ih_l0. Even with key stripping fix,
    if the loading model is ALSO compiled, the stripped keys don't match the
    compiled model's _orig_mod. keys.
  failure_mode: >
    Symmetric mismatch: checkpoint has _orig_mod. keys, model also has _orig_mod.
    keys (from its own compile). Stripping checkpoint keys → model's _orig_mod.
    keys don't match stripped keys. Both sides must agree on compile state.
  lesson: >
    Disable torch.compile for BOTH pretrain (checkpoint saving) and finetune/test
    (checkpoint loading). The speed benefit is not worth the key compatibility
    headaches. If compile is needed, must compile both sides identically.
  evidence:
    - "Remote test log: missing keys with _orig_mod. prefix after stripping"
    - "Fix: disabled torch.compile in both pretrain_exp.py and physformer_exp.py"
    - "After fix: GRU weights loaded correctly, MAE improved from 0.004+ to 0.002"
  status: resolved
  also_depends_on: [N123, N126]

