      # ============================================================
      # C08: Variance Decomposition Analysis (2026-05-15)
      # ============================================================
      - id: N38
        type: analysis
        support_level: explicit
        source_refs: ["docs/analysis/c08_variance_decomposition.md",
                      "scripts/c08_extract_and_analyze.py"]
        title: "C08 variance decomposition: component error correlation structure dominates aggregate accuracy"
        description: >
          Extracted y_aux (per-component true values) from V6 S2 test DataLoader,
          combined with component_theory_real from physics_states.npz, and performed
          full variance decomposition of aggregate theory error:
          Var(e_net) = ΣVar(components) − 2ΣCov(pairs).

          gru64: component var sum=30.06e-6, covariance cancellation=−20.06e-6 (66.7%),
          net var=10.00e-6.
          gru96: component var sum=58.76e-6 (1.95×), covariance cancellation=−46.90e-6
          (2.34×, 79.8%), net var=11.86e-6 (only 1.19×).

          Dominant channel: Cov(e_PV, e_B) — gru96 = −39.42e-6 vs gru64 = −12.92e-6 (3.05×).
          pv-batt correlation: gru96 r=+0.833 vs gru64 r=+0.632.
        result: >
          Larger GRU capacity (gru96) → stronger shared representations → more correlated
          component errors → MORE cancellation (79.8% vs 66.7%) → aggregate preserved
          despite 1.95× larger component variance. This is the OPPOSITE direction from
          the original C08 hypothesis (which predicted "tighter coupling → less cancellation").
          Two regimes identified: (1) capacity regime (this analysis, verified) where more
          shared learning → more correlation → more cancellation; (2) isolation regime
          (V6.1, hypothesized) where gradient isolation → less correlation → less cancellation.
          C08 elevated from observation → supported.
        provenance: ai-executed
        also_depends_on: [N27, N28, N36]
        timestamp: "2026-05-15T14:00"

