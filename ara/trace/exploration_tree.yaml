      # ============================================================
      # V6: Load Behavioral Module — Stage 1 & Stage 2 (2026-05-14)
      # ============================================================
      - id: N26
        type: experiment
        support_level: explicit
        source_refs: ["results/v6_s1_ablation/", "configs/physformer_v6_s1_gru64.yaml"]
        title: "V6 Stage 1: GRU temporal correction added to HDD/CDD — gru64 vs gru96"
        description: >
          Add GRU temporal encoder (LoadTemporalModule, d_gru=64/96, 2 layers) as additive
          correction to existing HDD/CDD load branch. GRU processes [net_load, temp, calendar]
          over 672 historical steps to produce 96-step temporal correction.
          Fusion: load = softplus(HDD/CDD + GRU_correction). Parallel runs on 3080Ti (12GB).
        result: >
          **d_gru=64 wins all 19 metrics.** gru64: MAE=0.001952, MSE=7.691e-6, RMSE=0.002773,
          Theory MAE=0.002483. gru96 universally worse (Load +15%, Battery +26%).
          vs V5.5b: MAE -2.4%, Theory MAE -9.8%, MSE +5.6%.
          Warm restart @ epoch 25, early stop @ epoch 39.
        provenance: ai-executed
        also_depends_on: [N18]
        timestamp: "2026-05-14T22:00"

      - id: N27
        type: experiment
        support_level: explicit
        source_refs: ["results/v6_s2_ablation/", "configs/physformer_v6_s2_gru64.yaml"]
        title: "V6 Stage 2: Temp MLP replaces HDD/CDD — gru64 vs gru96"
        description: >
          Replace HDD/CDD with 3-layer MLP (1→32→32→1) for temperature→load. Test
          d_gru=64 (S1 winner) vs 96 in context where Temp MLP handles temperature response.
          GRU role changes from "compensate bad physics" to "residual temporal patterns."
        result: >
          **SPLIT: d_gru ordering REVERSES from Stage 1.** gru64 wins all 5 component MAEs
          (Battery -51.6%, Wind -57.6%, PV -33.9%, Load -11.4%, SOC -47.2% vs gru96).
          gru96 wins aggregate (MAE=0.002003, MSE=7.281e-6 = V5.5b, RMSE=0.002698,
          RampViol=0.00316%; residual mean=0.000031 near zero). Interpretation: larger GRU
          duplicates Temp MLP, degrading components. Smaller GRU's capacity constraint
          enforces physics-data boundary. vs Stage 1: PV -24.3%, Battery -34.6%.
        provenance: ai-executed
        also_depends_on: [N26]
        timestamp: "2026-05-14T23:00"

      - id: N28
        type: insight
        support_level: explicit
        source_refs: ["results/v6_s1_ablation/", "results/v6_s2_ablation/"]
        title: "Capacity ceiling governs physics-data specialization boundary"
        description: >
          When physical (Temp MLP) and data-driven (GRU) modules share input features,
