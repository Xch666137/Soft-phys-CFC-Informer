      # ============================================================
      # V7.1: Lagged Temperature States (planned, post-V7)
      # ============================================================
      - id: N40
        type: question
        support_level: explicit
        source_refs: ["ara/staging/observations.yaml:O10",
                      "ara/staging/observations.yaml:O12"]
        title: "Can lagged temperature states capture building thermal inertia and improve Load theory accuracy beyond instantaneous temperature alone?"
        description: >
          Buildings have thermal mass — indoor temperature (and thus HVAC load)
          responds to outdoor temperature with inertia. Current model uses only
          instantaneous temperature T(t). Real building load integrates temperature
          over multiple time scales: immediate (current hour), short-lag (1-3h,
          thermal mass of light construction), medium-lag (6-12h, heavy construction),
          diurnal (24h, day-night cycle memory).

          Replace single temperature input with a bank of lagged states:
          T_lag(t) = [T(t), T(t−1h), T(t−3h), T(t−6h), T(t−12h), T(t−24h)]

          This can be layered on top of either BalancePoint or Temp MLP:
          - BalancePoint + Lags: each lag gets its own degree-day → T_bal weighted
            average across lags (physical: "effective temperature" integrates history)
          - Temp MLP + Lags: MLP input expands from 1→N_lags dims (data-driven fusion)

          The key physics insight: thermal inertia means the "effective" balance-point
          temperature is not the instantaneous outdoor temperature but a weighted
          moving average. This is standard in building energy modeling (ASHRAE
          variable-base degree-day method with 3-day averaging).

          Implementation scope: ~20 lines in _load_branch + config flag.
          Priority: post-V7 — only if Balance-Point alone leaves residual Load error
          that correlates with temperature change rate or lag.
        status: planned
        provenance: ai-suggested
        trigger: "V7 Balance-Point完成后, 若Load residual仍与温度变化率相关, 则激活此路径"
        depends_on: [N39]
        timestamp: "2026-05-15T15:00"

