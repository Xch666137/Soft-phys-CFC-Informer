# ============================================================
# N129: B1 evaluation framework reframed (decision, 2026-06-10)
# ============================================================

- id: N129
  type: decision
  title: "B1 evaluation reframed: component dispatchability over aggregate MSE"
  provenance: user
  timestamp: "2026-06-10T00:00"
  choice: >
    B1 success should NOT be judged solely on aggregate net MAE vs A1.
    In DVPP operations, the goal is dispatchable per-component schedules —
    net injection forecast is a means, not an end. MCP pretrain+finetune
    trades <5% aggregate MAE for 4-dimensional component-level decomposability,
    enabling operators to answer "which DER to adjust?" for peak shaving,
    ancillary market bidding, and penalty avoidance. This reframes the thesis
    narrative from "B1 vs A1" to "component-accuracy vs aggregate-accuracy
    Pareto tradeoff in DVPP dispatch context."
  alternatives:
    - "Continue judging B1 by aggregate MAE alone — rejected: ignores DVPP operational reality"
    - "Abandon pretrain+finetune because it doesn't beat A1 on net MAE — rejected: misses the point of component dispatchability"
    - "Separate forecasting and dispatch into two-stage pipeline (forecast net → optimize dispatch) — viable but orthogonal; MCP integrates both"
  evidence:
    - "N128: B1 3-seed MAE=0.001894 (+4.6% vs A1)"
    - "C08: component error cancellation structure — pure net MSE hides component inaccuracy"
    - "O62: DVPP dispatch argument (user)"
    - "C13: component-dispatchability value proposition"
  status: resolved
  also_depends_on: [N128, C08, C11, C12]

