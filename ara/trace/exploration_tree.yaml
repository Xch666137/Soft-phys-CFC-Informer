# ============================================================
# N110: B1 config_to_args bug — pretrained_path never loaded (dead_end, 2026-05-31)
# ============================================================
# provenance: ai-executed (discovered), user (confirmed)

- id: N110
  type: dead_end
  title: "B1 original finetune was from-scratch — config_to_args missing pretrained_path"
  provenance: ai-executed
  timestamp: "2026-05-31T15:10"
  hypothesis: >
    B1 finetune loaded pretrained weights from Phase B pretraining before pure net_mse
    finetuning.
  failure_mode: >
    config_to_args in physformer/config.py maps 40+ training keys manually (one-by-one
    explicit flat["key"] = training_cfg.get("key", default) calls), but the explicit
    mapping list MISSED pretrained_path and pretrain_lambda_net. Both keys ARE in
    TRAINING_KEYS (used by materialize_resolved_config for config saving), so the
    saved config_merged.yaml contained pretrained_path — creating the false appearance
    that finetune loaded pretrained weights. But args.pretrained_path was never set,
    so train()'s `getattr(self.args, "pretrained_path", None)` returned None, and the
    entire pretrained-weight-loading block was skipped. The model trained from random
    initialization on pure net_mse.

    Evidence:
    (1) No "Loaded pretrained weights from:" line in any of 3 seeds' train.log.
    (2) No "Pretrained checkpoint not found at:" warning either — the if-block was
        never entered.
    (3) Epoch 1 Train Loss = 1.0306, Val MSE = 0.7215 — consistent with random init.
    (4) --print-config confirmed: pretrained_path absent from resolved args.
    (5) After fix: "Loaded pretrained weights" appeared, Epoch 1 Train Loss = 0.1211.
    (6) config_to_args at lines 205-207 mapped grad_angle_interval → use_compile →
        val_interval, then jumped to hardware section. pretrained_path and
        pretrain_lambda_net (TRAINING_KEYS[36-37]) were in the gap.
  lesson: >
    Two-part config mapping (explicit manual + auto TRAINING_KEYS iteration in different
    functions) is a fragility pattern: additions to TRAINING_KEYS silently don't take
    effect in config_to_args unless the manual list is also updated. The config system
    should have ONE source of truth for key→arg mapping, not two copies that must be
    kept in sync. This is the second config_to_args propagation bug (cf. N65: 4 missing
    curriculum keys on 2026-05-22).
  status: resolved
  children:
    - id: N111
      type: decision
      title: "Fix config_to_args — add pretrained_path and pretrain_lambda_net"
      provenance: ai-executed
      timestamp: "2026-05-31T15:13"
      choice: >
        Added two lines to physformer/config.py:208-209:
          flat["pretrained_path"] = training_cfg.get("pretrained_path", None)
          flat["pretrain_lambda_net"] = training_cfg.get("pretrain_lambda_net", 1.0)
        Placed after grad_angle_interval and before hardware_cfg section.
      evidence: ["--print-config confirmed pretrained_path now resolved"]
      status: resolved
      children:
        - id: N112
          type: experiment
          title: "B1 finetune (FIXED) — 3 seeds on VGPU-32GB with pretrained weights"
          provenance: ai-executed
          timestamp: "2026-05-31T15:16"
          result: >
            Pretrained weights successfully loaded (confirmed in log). Epoch 1 Train
            Loss = 0.1163 (vs 1.0306 buggy — 9× better starting point). BUT all 3
            seeds show monotonic Val MSE DEGRADATION:
              E1: MSE(MW²) = 7.956-7.999e-06
              E2: MSE(MW²) = 8.270-8.320e-06 (+4%)
              E3: MSE(MW²) = 8.554-8.695e-06 (+7.5% vs E1)
            Train Loss continues decreasing (0.116→0.109) — overfitting.
            Pretrained-only baseline Test MSE(MW²) = 6.404e-06 (MAE 0.001820).
            Training killed after Epoch 3 at user request.
          hypothesis: >
            Multi-task pretraining (component + theory + net_mse) is the OPTIMAL
            predictor; pure net_mse finetuning removes beneficial regularization.
          status: resolved
          children:
            - id: N113
              type: dead_end
              title: "Pure net_mse finetune on pretrained weights systematically degrades performance"
              provenance: ai-executed
              timestamp: "2026-05-31T15:40"
              hypothesis: >
                Phase B's pretrain→finetune paradigm would improve Test MAE beyond the
                pretrained baseline (MAE 0.001820) and pass the Gate (MAE < 0.001811).
              failure_mode: >
                Both the original (buggy, from-scratch) and fixed (true finetune) runs
                converge on the SAME conclusion: pure net_mse training CANNOT match or
                exceed the multi-task pretrained model's prediction quality.

                Original run (N110 bug): from-scratch net_mse training → MAE 0.001839-0.001863
                Fixed run (N112): true finetune from pretrained → Val MSE DEGRADES E1→E3
                Pretrained direct test: MAE 0.001820 (best, 0.5% below Gate)

                The multi-task pretraining objective (component_mae + theory_mae + λ=0.3
                net_mse) serves as an EFFECTIVE REGULARIZER. Removing the auxiliary losses
                during finetuning removes the regularization, causing the model to overfit
                on net_mse — Train Loss drops while Val/Test degrade. The pretrained model
                is ALREADY the optimal net predictor; finetuning only makes it worse.

                This parallels the Phase A finding (C12) that all complexity additions
                degrade the simple A1 baseline — here, even a training-paradigm change
                (pretrain→finetune) cannot improve upon the pretrained checkpoint.
              lesson: >
                For this dataset and architecture, multi-task learning with auxiliary
                physics losses is not a stepping stone to better net_mse — it IS the
                destination. The auxiliary losses should be kept during the entire
                training process as regularizers. Future work should explore:
                (1) Tuning λ_net in pretraining (not finetuning) to push net_mse lower
                    while keeping component+theory losses as regularizers.
                (2) Joint training with all losses from the start (no phase separation).
                (3) Whether this result generalizes to other datasets or is specific to
                    NextGen's portfolio structure.
              status: resolved
              also_depends_on: [N107, N110, C11, C12]

