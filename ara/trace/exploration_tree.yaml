          temperature→load mapping. Codex (O10) flagged it as "too weakly physical" —
          no monotonicity, balance points, or lag. Replace with LearnedBalancePoint:
          load_temp = α_heat * softplus(T_bal_h − T) + α_cool * softplus(T − T_bal_c)
          with 4 learnable parameters (T_bal_h, T_bal_c, α_heat, α_cool).

          This creates a 3-point constraint spectrum:
          HDD/CDD (V5, fixed 18°C) → Balance-Point (V7, learned breakpoints) → Temp MLP (V6, unconstrained).

          Hypothesis: Balance-Point hits the sweet spot — enough physical structure
          to be interpretable and avoid overfitting, flexible enough to capture real
          VPP temperature response (asymmetric heating/cooling, region-specific balance points).
